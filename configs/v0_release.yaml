# The published v0 release.
#
#   python -m physviol.cli generate --config v0_release
#
# Tier `v0` at complexity L0, the full severity ladder, several randomisations per
# cell. Sizing (`physviol taxonomy --config v0_release`) before committing to a
# run is worth the ten seconds -- complexity, not the severity ladder, is the
# expensive dial: L1's photographic environment costs about 5.5x an L0 render,
# which turns a long overnight job into a week.
defaults:
  seed: 20260824
  complexity: L0

generate:
  tier: v0
  severity: all
  variants: 3
  keep_going: true
  workdir: out/work_v0
  outdir: out/physviol_v0

taxonomy:
  tier: v0
  complexity: L0
  severity: all
  variants: 3
